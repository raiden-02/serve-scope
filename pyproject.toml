[project]
name = "serve-scope"
version = "0.0.1"
description = "Local LLM inference lab for measuring and visualizing interactive/background interference, native priority, and external backpressure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.28.0",
    "httpx",
    "matplotlib",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
